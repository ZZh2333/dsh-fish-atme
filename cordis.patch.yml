# ============================================================================
# dsh-fish-atme —— bundle patch（插件自带的挂载声明）
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出 dsh-fish-atme 即生效。
# 下面这行的 id 必须等于 index.js 里 `export const name`（= 'fish-atme'）：
# DSH 的设置层用「entry id == 插件命名空间」来认领 Config，对不上就改不了参数。
#
# 真正的用户配置在插件 Config 里（设置页可改）；这里只放一份「安全的默认值」，
# 故意**不是**最激进的那档：一天 3 条、两条间隔 10 分钟、只回你自己。
# ============================================================================

- insert:
    - id: fish-atme
      name: dsh-fish-atme
      config:
        enabled: true
        intervalMinutes: 5
        maxPerDay: 3
        minGapMinutes: 10
        maxChars: 80
        dryRun: false
        # 人格底稿：agent-md = 读 <DSH_HOME>/AGENT.md（读不到自动回落内置底稿）
        personaSource: agent-md
        personaMode: append
        # 记忆默认关：检索要花向量化 token，要用了再开
        memoryEnabled: false
        # 字幕由刷B站提供，本插件只搬运（full = 带字幕 / off = 只凭标题）
        videoContext: full
